[server]
address = "127.0.0.1"
headless = true
enableXsrfProtection = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0e5f73"
backgroundColor = "#f4f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#1c2834"
font = "sans serif"

[client]
toolbarMode = "minimal"
